name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies (Tauri / webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf xdg-utils \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Test toss-core and toss-cli
        run: cargo test -p toss-core -p toss-cli

      # The Tauri crate's build script needs the frontend dist folder to exist,
      # so build the UI before checking the whole workspace.
      - name: Install desktop UI dependencies
        working-directory: apps/desktop
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi

      - name: Build desktop UI
        working-directory: apps/desktop
        run: npm run build

      # Also compiles the whole workspace (including the Tauri crate), so it replaces
      # `cargo check --workspace`. Needs the UI build above (frontendDist).
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace -- -D warnings

  # Deploy kit and installer scripts: syntax + lint. Cheap, no Rust build.
  scripts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell scripts (bash -n + shellcheck)
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(hub/relay/*.sh installer/**/*.sh installer/*.sh)
          echo "checking: ${files[*]}"
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x "${files[@]}"

      - name: Relay config template renders to valid TOML (open and allow-list)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/relaycfg"; mkdir -p "$d"
          printf 'RELAY_DOMAIN=relay.example.vn\nCONTACT_EMAIL=ci@example.com\nPROD_TLS=true\nRATE_BPS=52428800\n' > "$d/relay.env"
          export TOSS_RELAY_CONF_DIR="$d" TOSS_RELAY_TEMPLATE="$PWD/hub/relay/relay.toml.in"
          : > "$d/allowed.txt"
          hub/relay/update-allowed.sh --no-restart
          python3 -c "import tomllib,sys; c=tomllib.load(open(sys.argv[1],'rb')); assert c['access']=='everyone'; assert c['tls']['cert_mode']=='LetsEncrypt'; print('open ok')" "$d/relay.toml"
          printf '%s\n' "$(printf 'ab%.0s' $(seq 32))  # host" > "$d/allowed.txt"
          hub/relay/update-allowed.sh --no-restart
          python3 -c "import tomllib,sys; c=tomllib.load(open(sys.argv[1],'rb')); assert len(c['access']['allowlist'])==1; print('allow-list ok')" "$d/relay.toml"

  # PowerShell and NSIS cannot be run here, but the PowerShell parser can reject syntax errors.
  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 -Path installer | ForEach-Object {
            $errors = $null; $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $bad++; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" } }
            else { Write-Host "ok: $($_.FullName)" }
          }
          # The script must stay ASCII only (it is run from Windows PowerShell 5.1 without a BOM).
          Get-ChildItem -Recurse -Filter *.ps1 -Path installer | ForEach-Object {
            $nonAscii = [IO.File]::ReadAllBytes($_.FullName) | Where-Object { $_ -gt 127 } | Select-Object -First 1
            if ($nonAscii) { $bad++; Write-Host "non-ASCII byte in $($_.FullName)" }
          }
          if ($bad -gt 0) { exit 1 }

      - name: NSIS hook sanity (rule is UDP and removed on uninstall)
        shell: bash
        run: |
          set -euo pipefail
          f=apps/desktop/src-tauri/bundle/hooks.nsh
          grep -q 'add rule name="Toss".*protocol=UDP' "$f"
          grep -q 'delete rule name="Toss"' "$f"
          test "$(grep -c 'delete rule name="Toss"' "$f")" -ge 2
          grep -q '"installMode": "both"' apps/desktop/src-tauri/tauri.conf.json
          echo OK
