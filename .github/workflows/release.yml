name: Release

# Tag v* (e.g. v0.1.0) -> build Mac (universal) + Windows installers, publish a GitHub
# Release, then republish the installers under the STABLE names the link page
# (web/index.html, constant TOSS.assets) downloads from releases/latest/download/:
#   Toss.dmg         Toss-setup.exe
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v0.1.0)'
        required: true
        type: string
      notes:
        description: 'Release notes shown in the app updater; include #force to make every installed app update itself'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            find_glob: '*/bundle/dmg/*.dmg'
            asset: Toss.dmg
          - name: windows
            os: windows-latest
            args: ''
            rust_targets: ''
            find_glob: '*/bundle/nsis/*-setup.exe'
            asset: Toss-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install desktop UI dependencies
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else npm install; fi

      # Optional macOS signing + notarization. Without the secrets the build is unsigned.
      - name: Export Apple signing env (only if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$S_CERT" ]; then
            {
              echo "APPLE_CERTIFICATE=$S_CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$S_CERT_PW"
              echo "APPLE_SIGNING_IDENTITY=$S_IDENTITY"
              echo "APPLE_ID=$S_ID"
              echo "APPLE_PASSWORD=$S_PW"
              echo "APPLE_TEAM_ID=$S_TEAM"
            } >> "$GITHUB_ENV"
            echo "Apple signing enabled"
          else
            echo "No APPLE_CERTIFICATE secret: building unsigned"
          fi

      # v0.8.2: sign Toss.app with Toss's own (self-signed) certificate when the secrets exist.
      # macOS keys the Local Network permission to the designated requirement
      # ("identifier com.minhfatz.toss and certificate root = H…"): it then survives updates,
      # whereas an ad-hoc signature changes with every build and the user must re-allow.
      # Secrets: TOSS_MAC_CERT_P12 (base64 .p12), TOSS_MAC_CERT_PASSWORD. Without them: ad-hoc.
      - name: Import Toss signing certificate (macOS, if configured)
        if: runner.os == 'macOS'
        shell: bash
        env:
          P12_B64: ${{ secrets.TOSS_MAC_CERT_P12 }}
          P12_PW: ${{ secrets.TOSS_MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_B64:-}" ]; then echo "No TOSS_MAC_CERT_P12 secret: ad-hoc signing"; exit 0; fi
          kc="$RUNNER_TEMP/toss-sign.keychain-db"; kpw=$(openssl rand -hex 16)
          printf '%s' "$P12_B64" | base64 --decode > "$RUNNER_TEMP/toss.p12"
          security create-keychain -p "$kpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kpw" "$kc"
          security import "$RUNNER_TEMP/toss.p12" -k "$kc" -P "$P12_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/toss.p12" -passin "pass:$P12_PW" -nokeys -clcerts -out "$RUNNER_TEMP/toss-cert.pem"
          # Self-signed: codesign only uses a trusted identity.
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/toss-cert.pem"
          rm -f "$RUNNER_TEMP/toss.p12"
          security find-identity -v -p codesigning "$kc"
          echo "APPLE_SIGNING_IDENTITY=Toss Code Signing" >> "$GITHUB_ENV"
          echo "TOSS_SIGNED_WITH_CERT=1" >> "$GITHUB_ENV"

      - name: Build and publish release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v0.5.1 in-app updater: signs the update bundles (.app.tar.gz / -setup.exe) and
          # makes tauri-action upload latest.json, which installed apps poll.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          includeUpdaterJson: true
          tagName: ${{ env.TAG }}
          releaseName: 'Toss ${{ env.TAG }}'
          releaseBody: '${{ github.event.inputs.notes }} Cài đặt: xem docs/INSTALL.md. Mac: tải Toss.dmg. Windows: tải Toss-setup.exe.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # v0.8.1: the whole bundle must be signed (ad-hoc "-" via tauri.conf.json signingIdentity)
      # so macOS ties Local Network permission to com.minhfatz.toss. A bundle with only the
      # linker's signature ("Info.plist=not bound") never gets the permission the user grants.
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=$(find . -type d -path '*/bundle/macos/Toss.app' -print0 | xargs -0 -r ls -td | head -n 1)
          codesign -dv "$app" 2>&1 | tee /tmp/cs.txt
          grep -q '^Identifier=com.minhfatz.toss$' /tmp/cs.txt || { echo "::error::Toss.app bundle is not signed as com.minhfatz.toss"; exit 1; }
          if grep -q 'Info.plist=not bound' /tmp/cs.txt; then echo "::error::Info.plist not bound"; exit 1; fi
          if [ "${TOSS_SIGNED_WITH_CERT:-}" = 1 ]; then
            codesign -d -r- "$app" 2>&1 | tee -a /tmp/cs.txt
            grep -q 'Authority=Toss Code Signing' /tmp/cs.txt || { echo "::error::not signed with the Toss certificate"; exit 1; }
            grep -q 'certificate root = H' /tmp/cs.txt || { echo "::error::designated requirement does not pin the certificate"; exit 1; }
          fi

      # tauri-action names files like Toss_0.1.0_universal.dmg / Toss_0.1.0_x64-setup.exe.
      # The link page needs fixed names, so upload copies under the stable names.
      - name: Upload installer under stable asset name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLOB: ${{ matrix.find_glob }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          # Newest match wins (a restored build cache may hold an older bundle).
          src=$(find . -type f -path "$GLOB" -print0 | xargs -0 -r ls -t | head -n 1)
          if [ -z "$src" ]; then
            echo "::error::no file matching $GLOB"; exit 1
          fi
          echo "Using: $src"
          mkdir -p release-assets
          cp "$src" "release-assets/$ASSET"
          gh release upload "$TAG" "release-assets/$ASSET" --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    name: verify stable assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Toss.dmg and Toss-setup.exe are on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          for a in Toss.dmg Toss-setup.exe; do
            echo "$names" | grep -qx "$a" || { echo "::error::missing release asset $a"; exit 1; }
          done
