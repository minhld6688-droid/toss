name: desktop-check

# Compiles the desktop shell on macOS and Windows (clippy, warnings are errors), so code behind
# cfg(target_os = "macos") / cfg(windows) — menu bar drag & drop, Dock drop, registry menu — is
# checked before a release. Runs on every branch push that touches the shell.
on:
  workflow_dispatch:
  push:
    paths: ["apps/desktop/**", "crates/**", ".github/workflows/desktop-check.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop UI (frontendDist must exist)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Clippy toss-desktop
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p toss-desktop --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
      - name: Unit tests toss-desktop
        shell: bash
        run: |
          set -o pipefail
          cargo test -p toss-desktop 2>&1 | tee test.txt
      # Job logs need a login to read; failures are also published as annotations (public).
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          for f in clippy.txt test.txt; do
            [ -f "$f" ] || continue
            body=$(grep -E "^error|: error|^warning: unused|panicked|FAILED|^ *--> |^[0-9 ]+\|" "$f" | head -60 | perl -pe 's/%/%25/g; s/\r//g; s/\n/%0A/g')
            [ -n "$body" ] && echo "::error title=$f::$body"
          done
          exit 0
