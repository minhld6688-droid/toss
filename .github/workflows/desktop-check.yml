name: desktop-check

# Compiles the desktop shell on macOS and Windows (clippy, warnings are errors), so code behind
# cfg(target_os = "macos") / cfg(windows) — menu bar drag & drop, Dock drop, registry menu — is
# checked before a release. Runs on every branch push that touches the shell.
on:
  workflow_dispatch:
  push:
    paths: ["apps/desktop/**", "crates/**", ".github/workflows/desktop-check.yml", ".github/scripts/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop UI (frontendDist must exist)
        working-directory: apps/desktop
        run: npm ci && npm run build
      - name: Clippy toss-desktop
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p toss-desktop --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt
      # Windows: the Tauri lib test binary cannot start on the runner (no app manifest for
      # comctl32 v6), so tests run on macOS here and on Linux in ci.yml.
      - name: Unit tests toss-desktop
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cargo test -p toss-desktop 2>&1 | tee test.txt
      # Job logs need a login to read; failures are also published as annotations (public).
      - name: Report failures as annotations
        if: failure()
        run: node .github/scripts/annotate.mjs clippy.txt test.txt
