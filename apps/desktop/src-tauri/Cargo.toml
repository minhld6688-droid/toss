[package]
name = "toss-desktop"
description = "Toss desktop app (Tauri 2 shell around toss-core)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "toss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
toss-core = { path = "../../../crates/toss-core" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# v0.5.1 in-app updates (signed GitHub release feed, see tauri.conf.json plugins.updater).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# v0.5.2 short links (POST/GET https://<page_host>/api/s); same reqwest as the updater.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = "6"
hex = "0.4"
data-encoding = { workspace = true }
hostname = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
blake3 = { workspace = true }
# v0.4 diagnostics: rolling log file + "Xuất log" zip.
tracing-appender = "0.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Pin: tauri-plugin-deep-link 2.6.2 does not compile against rust-ini 0.21.3 (new ParseOption fields).
# Unused here; it only constrains resolution. Remove once the plugin is fixed upstream.
rust-ini = ">=0.21.0, <0.21.3"

[target.'cfg(windows)'.dependencies]
# Per-user Explorer context menu (HKCU\Software\Classes\Directory\shell\Toss).
winreg = "0.56"

[dev-dependencies]
# Tests check that the generated macOS Quick Action files are valid plists.
plist = "1"
